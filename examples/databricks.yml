bundle:
  name: dbt-curation-framework-dabs-examples

workspace:
  root_path: /Workspace/${var.domain}/dbt-curation/.bundle/${bundle.name}/${bundle.target}

variables:
  env:
    description: "Deployment environment (dev/test/prod)"
    default: dev
  catalog:
    description: "Unity Catalog where pre_gold and gold schemas will be written"
    default: enterprise_${var.env}
  pre_gold_schema:
    description: "Schema used as the default dbt target; staging and intermediate models land here"
    default: pre_gold
  warehouse_id:
    description: "SQL warehouse used to execute dbt commands"
    lookup:
      warehouse: "Example Warehouse"
  upstream_service_principal_id:
    description: "Service principal to give permission to trigger this job upstream"
    lookup:
      service_principal: "example-sp-${var.env}"
  downstream_job_id:
    description: "Downstream job to trigger after dbt run completes"
    lookup:
      job: "Example Downstream Job"

targets:
  local_dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/dbt-curation/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: dev

  dev:
    mode: production
    variables:
      env: dev

  test:
    mode: production
    variables:
      env: test

  prod:
    mode: production
    variables:
      env: prod

include:
  - resources/*.yml
